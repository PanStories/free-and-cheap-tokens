name: build-site

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'schemas/**'
      - 'scripts/**'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

# actions/deploy-pages@v4 authenticates via OIDC, so it needs id-token: write;
# without it the deploy step fails with "Unable to get the ACTIONS_ID_TOKEN_REQUEST_URL".
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies (including sharp for OG)
        run: npm ci

      # sharp/librsvg on ubuntu runners has no CJK fonts by default; install Noto
      # so any Chinese text rendered into the OG image does not become tofu boxes
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Validate schema (no remote data deps)
        run: node scripts/build-catalog.mjs --check

      - name: Build catalog.json
        run: npm run build:catalog

      - name: Generate static site
        run: npm run build:site

      - name: Generate OG image
        run: node scripts/generate-og.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4